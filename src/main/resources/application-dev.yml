spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/taskmanager_dev}

logging:
  level:
    root: INFO
    com.dnb.taskmanager: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
    org.springframework.security: DEBUG

app:
  jwt:
    expiration-ms: 86400000 # 24 hours for dev convenience
  cors:
    allowed-origins: http://localhost:4200,http://127.0.0.1:4200,http://localhost:80

