spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://qa-mongodb.internal:27017/taskmanager_qa}

logging:
  level:
    root: INFO
    com.dnb.taskmanager: INFO
    org.springframework.security: INFO

app:
